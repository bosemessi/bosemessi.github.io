<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wordle - Unlimited & Challenge</title>
  <style>
    :root {
      --color-correct: #538d4e;
      --color-present: #b59f3b;
      --color-absent: #3a3a3c;
      --color-empty: #121213;
      --color-border: #3a3a3c;
      --color-text: #ffffff;
      --color-key: #818384;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--color-empty); color: var(--color-text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    header { width: 100%; max-width: 500px; padding: 15px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
    h1 { font-size: 1.6rem; letter-spacing: 2px; }
    
    .nav-btns { display: flex; gap: 8px; }
    .btn { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #4b5563; }

    #banner { background: #22c55e; color: black; padding: 6px 14px; font-weight: bold; border-radius: 20px; margin-top: 10px; font-size: 0.85rem; display: none; }

    #board-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
    #board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; width: 330px; height: 400px; }
    .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .tile { border: 2px solid var(--color-border); display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: bold; text-transform: uppercase; user-select: none; border-radius: 4px; }
    
    .tile[data-state="correct"] { background-color: var(--color-correct); border-color: var(--color-correct); }
    .tile[data-state="present"] { background-color: var(--color-present); border-color: var(--color-present); }
    .tile[data-state="absent"] { background-color: var(--color-absent); border-color: var(--color-absent); }

    #keyboard { width: 100%; max-width: 500px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .key-row { display: flex; justify-content: center; gap: 6px; touch-action: manipulation; }
    .key { background: var(--color-key); color: white; border: 0; border-radius: 4px; height: 55px; min-width: 30px; flex: 1; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; text-transform: uppercase; }
    .key.large { flex: 1.5; font-size: 0.75rem; }
    .key[data-state="correct"] { background-color: var(--color-correct); }
    .key[data-state="present"] { background-color: var(--color-present); }
    .key[data-state="absent"] { background-color: var(--color-absent); opacity: 0.5; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 10; }
    .modal-content { background: #1e1e24; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
    .modal input { width: 100%; padding: 10px; margin: 15px 0; font-size: 1.2rem; text-transform: uppercase; text-align: center; border-radius: 4px; border: 1px solid var(--color-border); background: #000; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>WORDLE</h1>
    <div class="nav-btns">
      <button class="btn btn-secondary" onclick="startNewRandomGame()">New Game</button>
      <button class="btn" onclick="openModal()">Challenge</button>
    </div>
  </header>

  <div id="banner">Custom Challenge Active!</div>

  <div id="board-container">
    <div id="board"></div>
  </div>

  <div id="keyboard"></div>

  <!-- Challenge Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>Challenge a Friend</h2>
      <p style="margin-top: 8px; font-size: 0.85rem; color: #aaa;">Type a 5-letter word for your friend to guess:</p>
      <input type="text" id="custom-word" maxlength="5" placeholder="e.g. BRAIN" />
      <button class="btn" onclick="generateLink()" style="width: 100%;">Copy Challenge Link</button>
      <button class="btn btn-secondary" onclick="closeModal()" style="width: 100%; margin-top: 8px;">Cancel</button>
    </div>
  </div>

    ];

    let secretWord = "";
    let currentRow = 0;
    let currentTile = 0;
    let isGameOver = false;
    const maxTries = 6;
    const wordLength = 5;

    // Check URL parameter (?w=...)
    const urlParams = new URLSearchParams(window.location.search);
    const customChallenge = urlParams.get('w');

    function initGame() {
      if (customChallenge && !secretWord) {
        try {
          const decoded = atob(customChallenge).toUpperCase();
          if (decoded.length === 5) {
            secretWord = decoded;
            document.getElementById('banner').style.display = 'block';
          } else {
            pickRandomWord();
          }
        } catch(e) {
          pickRandomWord();
        }
      } else if (!secretWord) {
        pickRandomWord();
      }

      resetBoardAndKeyboard();
    }

    function pickRandomWord() {
      document.getElementById('banner').style.display = 'none';
      const randomIndex = Math.floor(Math.random() * WORDS.length);
      secretWord = WORDS[randomIndex];
    }

    function startNewRandomGame() {
      // Clear URL parameter without reloading
      if (window.location.search) {
        window.history.pushState({}, document.title, window.location.pathname);
      }
      secretWord = "";
      pickRandomWord();
      resetBoardAndKeyboard();
    }

    function resetBoardAndKeyboard() {
      currentRow = 0;
      currentTile = 0;
      isGameOver = false;

      // Render Board
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let i = 0; i < maxTries; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let j = 0; j < wordLength; j++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${i}-${j}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }

      // Render Keyboard
      const keyboardLayout = [
        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
        ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
        ["ENTER", "Z", "X", "C", "V", "B", "N", "M", "DEL"]
      ];
      const keyboardContainer = document.getElementById('keyboard');
      keyboardContainer.innerHTML = '';

      keyboardLayout.forEach(rowKeys => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'key-row';
        rowKeys.forEach(key => {
          const btn = document.createElement('button');
          btn.className = `key ${key.length > 1 ? 'large' : ''}`;
          btn.innerText = key;
          btn.setAttribute('data-key', key);
          btn.onclick = () => handleInput(key);
          rowDiv.appendChild(btn);
        });
        keyboardContainer.appendChild(rowDiv);
      });
    }

    // Keyboard Events
    document.addEventListener('keydown', (e) => {
      if (isGameOver) return;
      if (e.key === 'Enter') handleInput('ENTER');
      else if (e.key === 'Backspace') handleInput('DEL');
      else if (/^[a-zA-Z]$/.test(e.key)) handleInput(e.key.toUpperCase());
    });

    function handleInput(key) {
      if (isGameOver) return;

      if (key === 'DEL') {
        if (currentTile > 0) {
          currentTile--;
          const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
          tile.innerText = '';
        }
      } else if (key === 'ENTER') {
        if (currentTile === wordLength) {
          submitGuess();
        } else {
          alert("Not enough letters");
        }
      } else if (currentTile < wordLength) {
        const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
        tile.innerText = key;
        currentTile++;
      }
    }

    function submitGuess() {
      let guess = "";
      for (let j = 0; j < wordLength; j++) {
        guess += document.getElementById(`tile-${currentRow}-${j}`).innerText;
      }

      const letterCounts = {};
      for (let char of secretWord) {
        letterCounts[char] = (letterCounts[char] || 0) + 1;
      }

      const states = Array(wordLength).fill('absent');

      // Pass 1: Correct positions (Green)
      for (let j = 0; j < wordLength; j++) {
        if (guess[j] === secretWord[j]) {
          states[j] = 'correct';
          letterCounts[guess[j]]--;
        }
      }

      // Pass 2: Present letters (Yellow)
      for (let j = 0; j < wordLength; j++) {
        if (states[j] !== 'correct' && secretWord.includes(guess[j]) && letterCounts[guess[j]] > 0) {
          states[j] = 'present';
          letterCounts[guess[j]]--;
        }
      }

      // Render Updates
      for (let j = 0; j < wordLength; j++) {
        const tile = document.getElementById(`tile-${currentRow}-${j}`);
        tile.setAttribute('data-state', states[j]);

        const keyBtn = document.querySelector(`button[data-key="${guess[j]}"]`);
        const currentState = keyBtn.getAttribute('data-state');
        if (states[j] === 'correct' || (states[j] === 'present' && currentState !== 'correct')) {
          keyBtn.setAttribute('data-state', states[j]);
        } else if (!currentState) {
          keyBtn.setAttribute('data-state', 'absent');
        }
      }

      if (guess === secretWord) {
        alert("🎉 Excellent! You solved it!");
        isGameOver = true;
      } else if (currentRow === maxTries - 1) {
        alert(`Game Over! The word was: ${secretWord}`);
        isGameOver = true;
      } else {
        currentRow++;
        currentTile = 0;
      }
    }

    // Modal & Link Generation
    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function generateLink() {
      const wordInput = document.getElementById('custom-word').value.trim().toUpperCase();
      if (wordInput.length !== 5 || !/^[A-Z]+$/.test(wordInput)) {
        alert("Please enter a valid 5-letter word.");
        return;
      }
      
      const encodedWord = btoa(wordInput);
      const challengeUrl = `${window.location.origin}${window.location.pathname}?w=${encodedWord}`;
      
      navigator.clipboard.writeText(challengeUrl);
      alert("Challenge link copied! Send it to your friends.");
      closeModal();
    }

    // Start on load
    initGame();
  </script>
